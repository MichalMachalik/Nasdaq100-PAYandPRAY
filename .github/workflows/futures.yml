name: Futures quote update
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/futures.yml"
      - "scripts/update_futures.py"
      - "tests/test_refresh_24x7.py"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: futures-quote
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test weekend quote retention and source selection
        run: python -m unittest discover -s tests -p test_refresh_24x7.py -v
      - name: Fetch delayed futures quotation
        run: python scripts/update_futures.py
      - name: Commit verified quote only if changed
        run: |
          if git diff --quiet -- data/futures.json; then
            echo "No change in source quotation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures.json
          git commit -m "Refresh Nasdaq-100 futures quote"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            if git push; then exit 0; fi
          done
          exit 1

