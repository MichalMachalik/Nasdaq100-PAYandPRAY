name: Nasdaq-100 top ten by market cap
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_top10.py"
      - ".github/workflows/top10.yml"
  schedule:
    - cron: "11 * * * 1-5"
permissions:
  contents: write
concurrency:
  group: nasdaq-top-ten
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch company market capitalizations, prices and daily returns
        run: python scripts/update_top10.py
      - name: Commit verified changes
        run: |
          if git diff --quiet -- data/top10.json; then
            echo "No market data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top10.json
          git commit -m "Refresh Nasdaq-100 top ten market caps"
          git push
