name: Nasdaq-100 evidence-based 1-3 month downside
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/latest.json"
      - "scripts/update_risk_model.py"
      - "tests/test_risk_model.py"
      - ".github/workflows/risk-model.yml"
  schedule:
    - cron: "47 * * * *"
permissions:
  contents: write
concurrency:
  group: ndx-risk-model
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate, fetch and safely publish source data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Refresh attempt $attempt"
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
            git checkout --detach FETCH_HEAD
            python -m unittest discover -s tests -p test_risk_model.py -v
            python scripts/update_risk_model.py
            git add -- data/risk-model.json
            if git diff --cached --quiet; then
              echo "Source unchanged; no new snapshot to publish."
              exit 0
            fi
            git commit -m "Refresh verified risk-model data"
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep "$((attempt * 3))"
            fi
          done
          echo "::error::Publication conflict: verified remote snapshot preserved."
          exit 1
