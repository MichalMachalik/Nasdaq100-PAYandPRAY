name: Nasdaq-100 evidence-based 1-3 month downside
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_risk_model.py"
      - "tests/test_risk_model.py"
      - ".github/workflows/risk-model.yml"
  schedule:
    - cron: "47 * * * *"
permissions:
  contents: write
concurrency:
  group: ndx-risk-model
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate, refresh and publish against latest branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other hourly writers can update main while this job is fetching data.
          # Recompute on the latest committed snapshot, rather than merge stale JSON.
          # Never force-push or bypass observation-date/source validation.
          for attempt in 1 2 3 4; do
            echo "Refresh attempt $attempt"
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
            git checkout --detach FETCH_HEAD
            python -m unittest discover -s tests -p test_risk_model.py -v
            python scripts/update_risk_model.py
            if git diff --quiet -- data/risk-model.json; then
              echo "Verified data unchanged."
              exit 0
            fi
            git add -- data/risk-model.json
            git commit -m "Refresh observed Nasdaq-100 volatility and Treasury risk inputs"
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Publication failed; reload latest branch and revalidate before retrying."
              sleep "$((attempt * 3))"
            fi
          done
          echo "::error::Could not publish verified data after four attempts; existing remote data retained."
          exit 1
