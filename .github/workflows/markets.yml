name: Trading Economics commodities and FX
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_markets.py"
      - ".github/workflows/markets.yml"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: te-market-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Retrieve dated Trading Economics quotes
        run: python scripts/update_markets.py
      - name: Commit validated data
        run: |
          if git diff --quiet -- data/markets.json; then
            echo "No updated provider quotes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          git commit -m "Update public commodity and EURUSD market references"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            if git push; then exit 0; fi
          done
          exit 1
